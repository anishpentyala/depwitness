[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "depwitness"
version = "0.3.1"
description = "Exact CSV functional-dependency counts and opt-in counterexamples"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
depwitness = "depwitness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
