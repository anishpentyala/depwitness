[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "depwitness"
version = "0.3.2"
description = "Exact CSV functional-dependency counts and opt-in counterexamples"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Anish Pentyala"}]
keywords = ["csv", "functional-dependency", "data-validation"]

[project.urls]
Homepage = "https://github.com/anishpentyala/depwitness"
Repository = "https://github.com/anishpentyala/depwitness"
Issues = "https://github.com/anishpentyala/depwitness/issues"

[project.scripts]
depwitness = "depwitness.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
